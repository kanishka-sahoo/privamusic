# Keep the existing project identity when upgrading from the nested layout.
name: privamusic-next
services:
  dashboard:
    build: .
    image: privamusic-next:local
    restart: unless-stopped
    init: true
    shm_size: 256m
    env_file: .env
    environment:
      NAVIDROME_URL: http://navidrome:4533
      NAVIDROME_PORT: ${NAVIDROME_PORT:-4533}
      # Lets the dashboard link to Navidrome's own tailnet name when both are exposed as Tailscale Services.
      NAVIDROME_TAILNET_HOSTNAME: ${NAVIDROME_SERVICE_NAME:-}
      NAVIDROME_PUBLIC_URL: ${NAVIDROME_PUBLIC_URL:-}
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${DASHBOARD_PORT:-18780}:8080'
    volumes:
      - ./build/data:/data
      - ./build/music:/music
      - ${NEXT_SESSION_DIR:-./build/session}:/root/.local/share/spotiflac-next
    depends_on:
      - navidrome
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:8080/healthz").then(r=>r.json()).then(x=>process.exit(x.ready?0:1)).catch(()=>process.exit(1))']
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 4
  navidrome:
    image: deluan/navidrome@sha256:9012939114fbb1bb641b81cf96dec5ded15f0aafefe8d47a511d7cb919658e40
    restart: unless-stopped
    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_SCANNER_SCHEDULE: '0'
      ND_SUBSONIC_DEFAULTREPORTREALPATH: 'true'
      ND_COVERARTPRIORITY: embedded
      ND_DISCARTPRIORITY: embedded
      ND_LYRICSPRIORITY: '.lrc,embedded'
      ND_LOGLEVEL: warn
      ND_ENABLESHARING: 'false'
      ND_ENABLEEXTERNALSERVICES: 'false'
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${NAVIDROME_PORT:-4533}:4533'
    volumes:
      - ./build/music:/music:ro
      - ./build/navidrome:/data
  # Optional tailnet exposure (COMPOSE_PROFILES=tailnet in .env). One sidecar joins the tailnet as a tagged
  # node and advertises both services as Tailscale Services, so they get stable names such as
  # https://privamusic.<tailnet>.ts.net and https://navidrome.<tailnet>.ts.net with Tailscale-issued
  # certificates. deploy.sh applies the serve configuration after start; it persists in build/tailscale.
  # Userspace networking needs no extra capabilities. The tailnet name is discovered at runtime.
  tailscale:
    image: tailscale/tailscale@sha256:8c42c4574ab066384fcb72f69e086a2ff1dd3652eb6f56856cee34bcf0d2f680
    profiles: [tailnet]
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TAILNET_NODE_NAME:-privamusic-host}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: 'true'
    volumes:
      - ./build/tailscale/node:/var/lib/tailscale
    depends_on:
      - dashboard
      - navidrome
